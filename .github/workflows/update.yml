name: Update GitHub Profile README

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || 'WolfamIT26' }}
  PROFILE_REPOSITORY: ${{ vars.PROFILE_REPOSITORY || 'WolfamIT26/WolfamIT26' }}
  PROFILE_OUTPUT_DIR: ${{ vars.PROFILE_OUTPUT_DIR || 'dist/profile' }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  LATEST_PROJECT_LIMIT: ${{ vars.LATEST_PROJECT_LIMIT || 8 }}
  INCLUDE_PRIVATE_REPOS: ${{ vars.INCLUDE_PRIVATE_REPOS || 1 }}
  GITHUB_CACHE: ${{ vars.GITHUB_CACHE || 1 }}
  GITHUB_CACHE_TTL_MS: ${{ vars.GITHUB_CACHE_TTL_MS || 21600000 }}

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generator repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore GitHub API cache
        uses: actions/cache@v4
        with:
          path: .cache/github-api
          key: profile-readme-cache-${{ github.run_id }}
          restore-keys: |
            profile-readme-cache-

      - name: Install dependencies
        run: npm ci

      - name: Generate profile README and assets
        run: npm run update-readme

      - name: Deploy generated profile
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROFILE_REPO_URL: https://github.com/WolfamIT26/WolfamIT26.git
          PROFILE_DIR: ${{ runner.temp }}/WolfamIT26-profile
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN secret is required."
            exit 1
          fi

          SOURCE_README="${GITHUB_WORKSPACE}/dist/profile/README.md"
          SOURCE_ASSETS="${GITHUB_WORKSPACE}/dist/profile/assets"

          if [ ! -f "${SOURCE_README}" ]; then
            echo "Generated README not found: ${SOURCE_README}"
            exit 1
          fi

          if [ ! -d "${SOURCE_ASSETS}" ]; then
            echo "Generated assets folder not found: ${SOURCE_ASSETS}"
            exit 1
          fi

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"

          rm -rf "${PROFILE_DIR}"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            clone --depth 1 "${PROFILE_REPO_URL}" "${PROFILE_DIR}"

          cp -f "${SOURCE_README}" "${PROFILE_DIR}/README.md"
          rm -rf "${PROFILE_DIR}/assets"
          mkdir -p "${PROFILE_DIR}/assets"
          cp -a "${SOURCE_ASSETS}/." "${PROFILE_DIR}/assets/"

          cd "${PROFILE_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "No profile README or asset changes to deploy."
            exit 0
          fi

          git add README.md assets
          git commit -m "docs: update generated profile README"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin HEAD
